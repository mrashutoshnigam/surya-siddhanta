# The in-container TLS listener, for running the image as its own edge.
# The entrypoint installs this as /etc/nginx/snippets/tls-server.conf only when
# ENABLE_TLS=1; on Render, which terminates TLS before traffic reaches the
# container, it is left out.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    # Mount real certificates over /etc/nginx/certs to replace the
    # self-signed pair the entrypoint generates on first start.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    include /etc/nginx/snippets/ss-site.conf;
}
