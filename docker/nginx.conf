# Public edge for the single-image Surya Siddhanta deployment.
#
# Only this server is reachable from outside the container: it serves the built
# React bundle as static files and reverse-proxies /api/* to the FastAPI
# backend, which listens on 127.0.0.1 only and is therefore unreachable except
# through here.
#
# This is a template: the entrypoint replaces __PORT__ and __API_PORT__ and
# writes the result to /etc/nginx/conf.d/default.conf, because nginx cannot
# read environment variables itself and Render dictates the listen port via
# $PORT at runtime.

upstream suryasiddhanta_api {
    # Loopback only -- uvicorn is bound to 127.0.0.1 by the entrypoint.
    server 127.0.0.1:__API_PORT__;
    keepalive 16;
}

# The scheme the *client* used. Behind a TLS-terminating proxy such as Render's
# edge, nginx itself only ever sees http, so trusting $scheme would make the
# FORCE_HTTPS redirect loop forever; the proxy's X-Forwarded-Proto is the
# truth there, and $scheme is the fallback when nginx is the edge itself.
map $http_x_forwarded_proto $ss_client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Whether FORCE_HTTPS should redirect this request. Health probes are exempt:
# Docker's HEALTHCHECK and Render's own probe reach the container directly over
# plain http with no X-Forwarded-Proto, and a 301 to an https port that does
# not exist inside the container would mark a healthy service as down.
map "$ss_client_proto:$uri" $ss_redirect_https {
    default               0;
    "http:/api/health"    0;
    "~^http:"             1;
}

server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;

    # Written by the entrypoint: empty by default, or a 301 to https when
    # FORCE_HTTPS=1.
    include /etc/nginx/snippets/force-https.conf;

    include /etc/nginx/snippets/ss-site.conf;
}

# Written by the entrypoint: the :443 server from nginx-tls.conf when
# ENABLE_TLS=1, empty otherwise (Render terminates TLS at its own edge).
include /etc/nginx/snippets/tls-server.conf;
