# Routing shared by the http and https servers. Included from nginx.conf and
# nginx-tls.conf.

access_log /dev/stdout;
error_log  /dev/stderr warn;

root /srv/www;
index index.html;

# Chapter payloads and the corpus search results are the large responses here.
gzip             on;
gzip_types       text/css text/javascript application/javascript application/json image/svg+xml;
gzip_min_length  1024;

client_max_body_size 2m;

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy no-referrer-when-downgrade always;

# The browser calls /api/calc/..., the backend mounts the same routers at
# /calc/... -- the trailing slash on proxy_pass strips the /api prefix, which
# is exactly what the Vite dev proxy does with its rewrite rule.
location /api/ {
    proxy_pass http://suryasiddhanta_api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $ss_client_proto;

    # A chatbot turn runs a multi-step tool-use loop against DeepSeek, so it
    # can legitimately take minutes; the nginx default of 60s would cut it.
    proxy_connect_timeout 10s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
}

# Hashed Vite assets are immutable; three.js alone is an ~880 KB chunk.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# react-router owns the URL space, so every unknown path is a client route.
location / {
    try_files $uri $uri/ /index.html;
}
