[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "surya-siddhanta"
version = "2.0.0"
description = "Complete Python implementation of all 14 chapters of the Surya Siddhanta ancient Indian astronomical system"
readme = "README_PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ashutosh Nigam" }]
requires-python = ">=3.9"
keywords = ["astronomy", "surya-siddhanta", "vedic", "indian-astronomy", "panchanga", "jyotish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["numpy>=1.24.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev  = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.27"]
api  = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "anthropic>=0.34"]

# The published distribution is the calculation library only: the chapter
# modules, the planet-wise view and the catalogs they load. The app layers
# (api, chatbot, daily_panchanga) and the corpus/RAG layer stay in the
# repository; they need fastapi/anthropic and a local corpus file.
[tool.setuptools.packages.find]
where = ["src"]
include = ["suryasiddhanta", "suryasiddhanta.planets"]
namespaces = false

[tool.setuptools.package-data]
suryasiddhanta = [
    "data/nakshatra_catalog.json",
    "data/cosmography_catalog.json",
    "data/instruments_catalog.json",
    "data/mana_catalog.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
