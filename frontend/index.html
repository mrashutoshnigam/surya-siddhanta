<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Surya Siddhanta Explorer</title>

    <!-- The documented substitutes: Inter for the display and sans
         faces, JetBrains Mono for every number. If the network is out,
         the system stack in styles.css takes over. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the stored theme before first paint, so a dark-mode reader
      // never sees a white flash. The toggle writes the same key.
      (function () {
        try {
          var stored = localStorage.getItem("ss-theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.setAttribute("data-theme", stored);
          }
        } catch (e) {
          /* private mode, blocked storage: fall through to the OS setting */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
