name: Universe Explorer
on:
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: universe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHANNEL: chromium
      # Fresh runners do not have the separate Windows OCR workspace. Use the
      # same committed export as the deployment image, including its JSON index.
      SS_CORPUS_DB_PATH: ${{ github.workspace }}/.ci-unindexed-corpus.db
      SS_CORPUS_JSON_PATH: ${{ github.workspace }}/src/suryasiddhanta/corpus/data/corpus.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -e '.[api,astronomy,dev]'
      - uses: actions/cache@v4
        with:
          path: paper/data/kernels/de440.bsp
          key: de440-a4ce9bf9b3282becc9f4b2ac3cebe03a2ae7599981aabd7265fd8482fff7c4b5
      - run: python docker/fetch_ephemeris.py
      - run: python -m pytest -q
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Start local application
        run: |
          python -m uvicorn suryasiddhanta.api.main:app --host 127.0.0.1 --port 8000 > /tmp/explorer-api.log 2>&1 &
          cd frontend
          npm run dev -- --host 127.0.0.1 > /tmp/explorer-vite.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health && curl -fsS http://127.0.0.1:5173/universe > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/explorer-api.log /tmp/explorer-vite.log
          exit 1
      - run: npm run check:universe
        working-directory: frontend
      - name: Measure production explorer under phone emulation
        working-directory: frontend
        env:
          EXPLORER_URL: http://127.0.0.1:5174
        run: |
          npm run preview -- --host 127.0.0.1 --port 5174 --strictPort > /tmp/explorer-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5174/universe > /dev/null; then break; fi
            sleep 1
          done
          node check-universe-performance.cjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: explorer-browser-evidence
          path: |
            tmp/universe
            /tmp/explorer-api.log
            /tmp/explorer-vite.log
            /tmp/explorer-preview.log
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ui
          load: true
          tags: suryasiddhanta-explorer:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test bundled UI and both astronomy models
        run: python docker/check_explorer_image.py --image suryasiddhanta-explorer:check
