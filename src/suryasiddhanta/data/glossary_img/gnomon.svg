<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" font-family="Inter, Arial, sans-serif" font-size="12">
  <title>Gnomon: an upright stick and its shadow</title>
  <line x1="20" y1="160" x2="300" y2="160" stroke="#8a919c" stroke-width="1.5"/>
  <line x1="290" y1="40" x2="110" y2="160" stroke="#f4b000" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="200" y1="160" x2="200" y2="100" stroke="#8a919c" stroke-width="4"/>
  <line x1="110" y1="160" x2="200" y2="160" stroke="#0052ff" stroke-width="4"/>
  <circle cx="290" cy="40" r="12" fill="#f4b000"/>
  <text x="208" y="130" fill="#8a919c">gnomon, 12 digits</text>
  <text x="120" y="180" fill="#0052ff" font-weight="600">shadow</text>
  <text x="240" y="22" fill="#f4b000" font-weight="600">Sun</text>
  <text x="20" y="30" fill="#8a919c">noon shadow at the equinox</text>
  <text x="20" y="46" fill="#8a919c">gives the latitude</text>
</svg>
